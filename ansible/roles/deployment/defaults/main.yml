# Default OpenTelemetry Collector configuration
otelcol_base_config:
  receivers:
    hostmetrics:
      enabled: true
      collection_interval: "60s"
      scrapers:
        - cpu
        - memory
        - disk
        - network
        - load
        - filesystem
        - processes
        - paging

  processors:
    batch:
      enabled: true
    memory_limiter:
      enabled: true
      limit_mib: 500
      spike_limit_mib: 100
    resourcedetection:
      enabled: true
      detectors: ["system", "env"]

  exporters:
    splunk_hec:
      enabled: true
      endpoint: "https://your-splunk-server:8088/services/collector"
      token: "your-splunk-hec-token"
      source: "otelcol"
      sourcetype: "otelcol_metrics"
      index: "metrics"
      insecure: false  # Set to true if using self-signed certs

  service:
    pipelines:
      metrics:
        receivers: [hostmetrics]
        processors: [memory_limiter, resourcedetection, batch]
        exporters: [splunk_hec]