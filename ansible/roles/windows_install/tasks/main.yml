---
# Tasks for installing OpenTelemetry Collector on Windows
- name: Check if otelcol-contrib is installed
  win_stat:
    path: "{{ otelcol_binary_path }}"
  register: otelcol_binary

- name: Set installation required flag
  set_fact:
    otelcol_install_required: "{{ not otelcol_binary.stat.exists or otelcol_force_install | bool }}"

- name: Stop and remove existing service when forcing reinstallation
  block:
    - name: Stop otelcol-contrib service
      win_service:
        name: otelcol-contrib
        state: stopped
      failed_when: false

    - name: Remove otelcol-contrib service
      win_shell: |
        & "{{ otelcol_binary_path }}" --service uninstall
      failed_when: false

    - name: Remove otelcol-contrib binary directory
      win_file:
        path: "{{ otelcol_install_dir }}"
        state: absent
  when: 
    - otelcol_binary.stat.exists 
    - otelcol_force_install | bool

- name: Create otelcol-contrib service account
  win_user:
    name: "otelcol-contrib"
    password: "{{ otelcol_service_password }}"  # This should come from Ansible Vault
    password_never_expires: yes
    description: "OpenTelemetry Collector service account"
    user_cannot_change_password: yes
    account_disabled: no
    state: present
  register: service_account
  when: otelcol_install_required

- name: Grant service account 'Log on as a service' right
  win_shell: |
    $tempPath = [System.IO.Path]::GetTempFileName()
    secedit /export /cfg $tempPath
    $content = Get-Content -Path $tempPath
    $logonAsServiceSetting = ($content | Select-String -Pattern "SeServiceLogonRight").ToString()
    
    if ($logonAsServiceSetting) {
      # Append to existing accounts
      $updatedSetting = $logonAsServiceSetting -replace "SeServiceLogonRight = ", "SeServiceLogonRight = otelcol-contrib,"
      $content = $content -replace [regex]::Escape($logonAsServiceSetting), $updatedSetting
    } else {
      # Create new setting
      $content += "SeServiceLogonRight = otelcol-contrib"
    }
    
    $content | Out-File $tempPath
    secedit /configure /db c:\windows\security\local.sdb /cfg $tempPath /areas USER_RIGHTS
    Remove-Item -Path $tempPath
  when: 
    - otelcol_install_required
    - service_account is changed

- name: Create otelcol-contrib directories (Windows) with proper permissions
  win_file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ otelcol_config_dir }}"
    - "{{ otelcol_log_dir }}"
  become: yes
  become_method: runas
  become_user: SYSTEM # this is needed to create the directories 
  when: ansible_os_family == 'Windows' and otelcol_install_required

- name: Download otelcol-contrib package
  win_get_url:
    url: "{{ otelcol_download_url }}"
    dest: "C:\\Temp\\otelcol-contrib-{{ otelcol_contrib_version }}.zip"
  when: otelcol_install_required

- name: Extract otelcol-contrib package
  win_unzip:
    src: "C:\\Temp\\otelcol-contrib-{{ otelcol_contrib_version }}.zip"
    dest: "{{ otelcol_install_dir }}"
    delete_archive: yes
  when: otelcol_install_required

- name: Create otelcol-contrib configuration
  win_template:
    src: "{{ role_path }}/../common/templates/otelcol-contrib.yaml.j2"
    dest: "{{ otelcol_config_path }}"
  notify: restart otelcol-contrib windows

- name: Set directory permissions for service account
  win_acl:
    path: "{{ item }}"
    user: otelcol-contrib
    rights: ReadAndExecute
    type: allow
    state: present
    inherit: yes
  with_items:
    - "{{ otelcol_install_dir }}"
    - "{{ otelcol_config_dir }}"
    - "{{ otelcol_log_dir }}"
  when: otelcol_install_required

- name: Install otelcol-contrib as a service with specific account (Windows)
  win_shell: |
    # Read password from secure environment variable
    $secure_pwd = ConvertTo-SecureString $env:SERVICE_PASSWORD -AsPlainText -Force
    $credential = New-Object System.Management.Automation.PSCredential(".\otelcol-contrib", $secure_pwd)
    Start-Process -FilePath "{{ otelcol_binary_path }}" -ArgumentList "--config={{ otelcol_config_path }}", "--service", "install" -Credential $credential -Wait -NoNewWindow
  environment:
    SERVICE_PASSWORD: "{{ otelcol_service_password }}"  # This sets the environment variable
  args:
    creates: "{{ otelcol_service_name }}"
  when: otelcol_install_required
  no_log: true
  
- name: Start otelcol-contrib service
  win_service:
    name: otelcol-contrib
    state: started
    start_mode: auto
  when: otelcol_install_required