---
# Handlers for install role
- name: restart otelcol-contrib
  systemd:
    name: otelcol-contrib
    state: restarted
    daemon_reload: yes
  become: true  
  when: ansible_os_family in ['RedHat', 'Debian']

- name: restart otelcol-contrib Windows
  win_service:
    name: otelcol-contrib
    state: restarted
  when: ansible_os_family == 'Windows'


- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  become: true
  when: ansible_os_family in ['RedHat', 'Debian']

- name: Enable otelcol-contrib
  ansible.builtin.systemd:
    name: otelcol-contrib
    enabled: yes
    state: started
  become: true
  when: ansible_os_family in ['RedHat', 'Debian']
