- name: Create Windows service for OpenTelemetry Collector
  win_service:
    name: otelcol-contrib
    display_name: "OpenTelemetry Collector Contrib"
    description: "OpenTelemetry Collector service for metrics and traces collection"
    path: '"C:\OpenTelemetry Collector\otelcol-contrib.exe" --config "C:\OpenTelemetry Collector\otelcol-contrib.yaml"'
    state: started
    start_mode: auto
    username: LocalSystem