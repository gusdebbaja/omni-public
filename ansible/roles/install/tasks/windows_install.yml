---
# Install OpenTelemetry Collector binaries and service on Windows
- name: Install OpenTelemetry Collector from MSI using msiexec directly
  win_command: msiexec.exe /i "C:\Temp\otelcol-contrib-{{ otelcol_contrib_version }}.msi" /quiet INSTALLDIR="C:\Program Files\OpenTelemetry Collector"
  register: msi_install_command

- name: Find where otelcol-contrib.exe was installed
  win_find:
    paths:
      - C:\Program Files
      - C:\Program Files (x86)
      - C:\OpenTelemetry Collector
    patterns: 
      - otelcol-contrib.exe
    recurse: yes
  register: otelcol_exe_find
  
- name: Debug found executable location
  debug:
    var: otelcol_exe_find

