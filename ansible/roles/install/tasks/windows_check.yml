---
# Check if OpenTelemetry Collector is already installed on Windows
- name: Check if otelcol-contrib is installed
  win_stat:
    path: "{{ otelcol_binary_path }}"
  register: otelcol_binary

- name: Set installation required flag
  set_fact:
    otelcol_install_required: "{{ not otelcol_binary.stat.exists or otelcol_force_install | bool }}"

- name: Stop and remove existing service when forcing reinstallation
  block:
  - name: Stop otelcol-contrib service
    win_service:
      name: otelcol-contrib
      state: stopped
    failed_when: false

  - name: Remove otelcol-contrib service
    win_shell: |
      & "{{ otelcol_binary_path }}" --service uninstall
    failed_when: false

  - name: Remove otelcol-contrib binary directory
    win_file:
      path: "{{ otelcol_install_dir }}"
      state: absent
  when:
  - otelcol_binary.stat.exists
  - otelcol_force_install | bool
