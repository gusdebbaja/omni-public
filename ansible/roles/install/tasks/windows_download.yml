---
# Download OpenTelemetry Collector package for Windows
- name: Create temp directory if it doesn't exist
  win_file:
    path: C:\Temp
    state: directory

- name: Download otelcol-contrib package
  win_get_url:
    url: "{{ otelcol_download_url }}"
    dest: "C:\\Temp\\otelcol-contrib-{{ otelcol_contrib_version }}.zip"
  register: download_result
  retries: 3
  delay: 5
  until: download_result is succeeded

- name: Extract otelcol-contrib package
  win_unzip:
    src: "C:\\Temp\\otelcol-contrib-{{ otelcol_contrib_version }}.zip"
    dest: "{{ otelcol_install_dir }}"
    delete_archive: yes
