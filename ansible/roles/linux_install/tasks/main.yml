---
# Tasks for installing OpenTelemetry Collector on Linux

- name: Check if otelcol-contrib binary exists
  stat:
    path: "{{ otelcol_binary_path }}"
  register: otelcol_binary

- name: Check if otelcol-contrib service is active
  service_facts:
  when: otelcol_binary.stat.exists

- name: Check if otelcol-contrib service file exists
  stat:
    path: "/etc/systemd/system/otelcol-contrib.service"
  register: otelcol_service_file
  when: otelcol_binary.stat.exists

- name: Set comprehensive installation status
  set_fact:
    otelcol_install_required: >-
      {{ not otelcol_binary.stat.exists or 
         otelcol_force_install | bool or
         (otelcol_binary.stat.exists and (
           not otelcol_service_file.stat.exists | default(true) or
           'otelcol-contrib.service' not in ansible_facts.services | default({}) or
           ansible_facts.services['otelcol-contrib.service'].state != 'running'
         ))
      }}

- name: Display installation decision
  debug:
    msg: "OpenTelemetry Collector installation is {{ 'required' if otelcol_install_required else 'not required' }} on {{ inventory_hostname }}"

- name: Stop and remove existing service when forcing reinstallation
  block:
    - name: Stop otelcol-contrib service
      become: true
      systemd:
        name: otelcol-contrib
        state: stopped
      failed_when: false

    - name: Remove otelcol-contrib binary
      become: true
      file:
        path: "{{ otelcol_binary_path }}"
        state: absent
  when: 
    - otelcol_binary.stat.exists 
    - otelcol_force_install | bool

- name: Set OS-specific package dependencies
  set_fact:
    pkg_dependencies:
      - curl
      - tar
      - "{{ 'policycoreutils-python-utils' if ansible_os_family == 'RedHat' else 'python3-selinux' if ansible_distribution == 'Ubuntu' else '' }}"
  when: otelcol_install_required

- name: Install dependencies
  become: true
  package:
    name: "{{ pkg_dependencies | select('string') | list }}"
    state: present
  when: otelcol_install_required

- name: Create otelcol-contrib user and group
  become: true
  user:
    name: otelcol-contrib
    system: yes
    shell: /sbin/nologin
    groups: "{{ otelcol_user_groups | default([]) }}"
    append: yes
    create_home: no
    comment: "OpenTelemetry Collector service account"
  when: otelcol_install_required

- name: Create otelcol-contrib directories with proper ownership
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
    owner: otelcol-contrib
    group: otelcol-contrib
  loop:
    - "{{ otelcol_config_dir }}"
    - "{{ otelcol_log_dir }}"
    - "{{ otelcol_data_dir | default('/var/lib/otelcol-contrib') }}"
  when: otelcol_install_required

- name: Download otelcol-contrib package
  get_url:
    url: "{{ otelcol_download_url }}"
    dest: "/tmp/otelcol-contrib-{{ otelcol_contrib_version }}.tar.gz"
    mode: 0644
    timeout: 60
    validate_certs: yes
  when: otelcol_install_required
  register: download_result
  retries: 3
  delay: 5
  until: download_result is succeeded

- name: Extract otelcol-contrib package
  become: true
  unarchive:
    src: "/tmp/otelcol-contrib-{{ otelcol_contrib_version }}.tar.gz"
    dest: "/tmp"
    remote_src: yes
  when: otelcol_install_required

- name: Install otelcol-contrib binary
  become: true
  copy:
    src: "/tmp/otelcol-contrib"
    dest: "{{ otelcol_binary_path }}"
    mode: 0755
    owner: root
    group: root
    remote_src: yes
  when: otelcol_install_required

- name: Create otelcol-contrib configuration
  become: true
  template:
    src: "{{ playbook_dir }}/../templates/otelcol-contrib.yml.j2"
    dest: "{{ otelcol_config_path }}"
    mode: 0644
    owner: otelcol-contrib
    group: otelcol-contrib
  notify: restart otelcol-contrib

- name: Create systemd service file
  become: true
  template:
    src: "{{ playbook_dir }}/../templates/otelcol-contrib.service.j2"
    dest: "/etc/systemd/system/otelcol-contrib.service"
    mode: 0644
    owner: root
    group: root
  notify: restart otelcol-contrib
  when: otelcol_install_required

- name: Configure SELinux context for otelcol-contrib (RedHat)
  become: true
  block:
    - name: Check if SELinux is enabled
      command: getenforce
      register: selinux_status
      changed_when: false
      failed_when: false

    - name: Set SELinux context for otelcol binary
      sefcontext:
        target: "{{ otelcol_binary_path }}"
        setype: bin_t
        state: present
      when: selinux_status.stdout is defined and selinux_status.stdout != "Disabled"

    - name: Apply SELinux context
      command: restorecon -v "{{ otelcol_binary_path }}"
      when: selinux_status.stdout is defined and selinux_status.stdout != "Disabled"
  when: 
    - ansible_os_family == 'RedHat'
    - otelcol_install_required

- name: Enable and start otelcol-contrib service
  become: true
  systemd:
    name: otelcol-contrib
    enabled: yes
    state: started
    daemon_reload: yes
  when: otelcol_install_required
