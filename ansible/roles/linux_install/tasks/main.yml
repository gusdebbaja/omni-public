---
# Tasks for installing OpenTelemetry Collector on Linux
- name: Check if otelcol-contrib is installed
  stat:
    path: "{{ otelcol_binary_path }}"
  register: otelcol_binary

- name: Create otelcol-contrib user
  user:
    name: otelcol-contrib
    system: yes
    shell: /sbin/nologin
    groups: "{{ otelcol_user_groups }}"
    append: yes
  when: not otelcol_binary.stat.exists

- name: Download otelcol-contrib package
  get_url:
    url: "{{ otelcol_download_url }}"
    dest: "/tmp/otelcol-contrib-{{ otelcol_contrib_version }}.tar.gz"
    mode: 0644
  when: not otelcol_binary.stat.exists

- name: Extract otelcol-contrib package
  unarchive:
    src: "/tmp/otelcol-contrib-{{ otelcol_contrib_version }}.tar.gz"
    dest: "/tmp"
    remote_src: yes
  when: not otelcol_binary.stat.exists

- name: Install otelcol-contrib binary
  copy:
    src: "/tmp/otelcol-contrib"
    dest: "{{ otelcol_binary_path }}"
    mode: 0755
    remote_src: yes
  when: not otelcol_binary.stat.exists

- name: Create otelcol-contrib configuration
  template:
    src: otelcol-contrib.yaml.j2
    dest: "{{ otelcol_config_path }}"
    mode: 0644
  notify: restart otelcol-contrib

- name: Create systemd service file
  template:
    src: otelcol-contrib.service.j2
    dest: /etc/systemd/system/otelcol-contrib.service
    mode: 0644
  notify: restart otelcol-contrib
  when: not otelcol_binary.stat.exists

- name: Enable and start otelcol-contrib service
  systemd:
    name: otelcol-contrib
    enabled: yes
    state: started
    daemon_reload: yes
  when: not otelcol_binary.stat.exists