---
# Upgrade OpenTelemetry Collector on Linux
- name: Get current version
  command: "{{ otelcol_binary_path }} --version"
  register: current_version
  changed_when: false

- name: Display current version
  debug:
    msg: "Current version: {{ current_version.stdout }}"

- name: Stop otelcol-contrib service
  systemd:
    name: otelcol-contrib
    state: stopped

- name: Download new otelcol-contrib package
  get_url:
    url: "{{ otelcol_download_url }}"
    dest: "/tmp/otelcol-contrib-{{ otelcol_contrib_version }}.tar.gz"
    mode: '0644'
  register: download_result
  retries: 3
  delay: 5
  until: download_result is succeeded

- name: Extract new otelcol-contrib package
  unarchive:
    src: "/tmp/otelcol-contrib-{{ otelcol_contrib_version }}.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Install new otelcol-contrib binary
  copy:
    src: "/tmp/otelcol-contrib"
    dest: "{{ otelcol_binary_path }}"
    mode: '0755'
    remote_src: yes

- name: Start otelcol-contrib service
  systemd:
    name: otelcol-contrib
    state: started
    daemon_reload: yes

- name: Get new version
  command: "{{ otelcol_binary_path }} --version"
  register: new_version
  changed_when: false

- name: Display upgrade results
  debug:
    msg: "Upgraded from {{ current_version.stdout }} to {{ new_version.stdout }}"
