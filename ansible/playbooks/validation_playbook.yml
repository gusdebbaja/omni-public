---
- name: Validate OpenTelemetry Collector Installation Prerequisites
  hosts: all
  gather_facts: true  # Gather all facts initially - more reliable
  tasks:
    - name: Check Python installation on Linux
      command: "which python3"
      register: python_check
      changed_when: false
      failed_when: false  # Better than ignore_errors
      when: ansible_os_family in ["RedHat", "Debian"]
      
    - name: Install Python 3 on RedHat systems
      package:
        name: python3
        state: present
      when:
        - ansible_os_family == "RedHat"
        - python_check.rc != 0
      become: true
      
    - name: Install Python 3 on Debian systems
      package:
        name: python3
        state: present
      when:
        - ansible_os_family == "Debian"
        - python_check.rc != 0
      become: true
      
    - name: Check if Python is installed on Windows
      win_shell: |
        try { 
          $pythonVersion = python --version 2>&1
          Write-Output "Python found"
          exit 0
        } catch {
          Write-Output "Python not found"
          exit 1
        }
      register: windows_python_check
      changed_when: false
      failed_when: false
      when: ansible_os_family == "Windows"

    - name: Ensure no other installations are running
      win_shell: |
        Get-Process | Where-Object { $_.ProcessName -like "*python*" } | Stop-Process -Force
      ignore_errors: yes
      when: 
        - ansible_os_family == "Windows"
        - windows_python_check.stdout is search("Python not found")

    - name: Download Python 3 installer on Windows
      win_get_url:
        url: "https://www.python.org/ftp/python/3.9.13/python-3.9.13-amd64.exe"
        dest: "C:\\Windows\\Temp\\python_installer.exe"
      when: 
        - ansible_os_family == "Windows"
        - windows_python_check.stdout is search("Python not found")

    - name: Install Python 3 on Windows
      win_shell: |
        Start-Process -FilePath "C:\Windows\Temp\python_installer.exe" -ArgumentList "/quiet", "InstallAllUsers=1", "PrependPath=1", "Include_test=0" -Wait -NoNewWindow
      args:
        executable: powershell.exe
      register: python_install
      changed_when: python_install.rc == 0
      failed_when: python_install.rc != 0
      when: 
        - ansible_os_family == "Windows"
        - windows_python_check.stdout is search("Python not found")

    - name: Remove Python installer
      win_file:
        path: "C:\\Windows\\Temp\\python_installer.exe"
        state: absent
      when: 
        - ansible_os_family == "Windows"
          
    - name: Set Python interpreter based on OS
      set_fact:
        ansible_python_interpreter: "{{ '/usr/bin/python3' if ansible_os_family in ['RedHat', 'Debian'] else 'python' }}"
          
    - name: Regather facts after Python installation (Linux)
      setup:
      when: >
        ansible_os_family in ['RedHat', 'Debian'] and 
        python_check is defined and 
        python_check.rc is defined and 
        python_check.rc != 0
        
    - name: Regather facts after Python installation (Windows)
      setup:
      when: >
        ansible_os_family == 'Windows' and 
        windows_python_check is defined and 
        windows_python_check.stdout is defined and 
        'Python not found' in windows_python_check.stdout

  roles:
    - validation