---
- name: Validate OpenTelemetry Collector Installation
  hosts: all
  gather_facts: false  # Changed to false initially
  
  pre_tasks:
    - name: Check if Python 3 is installed
      raw: command -v python3 || echo "not installed"
      register: python3_check
      changed_when: false
      ignore_unreachable: true
      
    - name: Install Python 3 on RedHat systems if not present
      raw: yum install -y python3
      when: 
        - "'redhat' in inventory_hostname or 'rhel' in inventory_hostname"
        - "'not installed' in (python3_check.stdout | default('')) or 'not installed' in (python3_check.stderr | default(''))"
      changed_when: true
      become: true
      ignore_unreachable: true
      
    - name: Gather facts after ensuring Python is installed
      setup:
      ignore_unreachable: true
  
  roles:
    - validation