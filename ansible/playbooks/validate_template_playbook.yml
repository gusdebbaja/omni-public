---
- name: Validate OpenTelemetry Collector Template
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Include OS-specific variables for Linux
      include_vars:
        file: "{{ playbook_dir }}/../roles/common/vars/Linux.yml"
        name: linux_vars
      tags: always
    
    - name: Include OS-specific variables for Windows
      include_vars:
        file: "{{ playbook_dir }}/../roles/common/vars/Windows.yml"
        name: windows_vars
      tags: always
    
    - name: Generate and validate Linux template
      block:
        - name: Set Linux facts
          set_fact:
            ansible_os_family: "RedHat"
            ansible_hostname: "test-linux-host"
            otelcol_binary_path: "{{ linux_vars.otelcol_binary_path }}"
            otelcol_config_dir: "{{ linux_vars.otelcol_config_dir }}"
            otelcol_config_path: "{{ linux_vars.otelcol_config_path }}"
        
        - name: Include template validation role for Linux
          include_role:
            name: template_validation
          vars:
            platform: "Linux"
    
    - name: Generate and validate Windows template
      block:
        - name: Set Windows facts
          set_fact:
            ansible_os_family: "Windows"
            ansible_hostname: "test-windows-host"
            otelcol_binary_path: "{{ windows_vars.otelcol_binary_path }}"
            otelcol_config_dir: "{{ windows_vars.otelcol_config_dir }}"
            otelcol_config_path: "{{ windows_vars.otelcol_config_path }}"
        
        - name: Include template validation role for Windows
          include_role:
            name: template_validation
          vars:
            platform: "Windows"