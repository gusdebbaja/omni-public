ansible_connection: psrp
ansible_psrp_transport: ntlm
ansible_psrp_protocol: https
ansible_psrp_port: 5986
ansible_psrp_ignore_proxy: true
ansible_psrp_verify: false
ansible_psrp_cert_validation: ignore
ansible_password: "{{ windows_ansible_password }}"
ansible_python_interpreter: auto
otelcol_install_dir: "C:\\Program Files\\OpenTelemetry Collector"
otelcol_binary_path: "C:\\Program Files\\OpenTelemetry Collector\\otelcol-contrib.exe"
otelcol_config_dir: "C:\\Program Files\\OpenTelemetry Collector"
otelcol_config_path: "C:\\Program Files\\OpenTelemetry Collector\\otelcol-contrib.yaml"
otelcol_log_dir: "C:\\"
otelcol_contrib_version: "0.121.0" # Update to your desired version
otelcol_download_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_contrib_version }}/otelcol-contrib_{{ otelcol_contrib_version }}_windows_amd64.zip"
otelcol_service_name: "otelcol-contrib"
otelcol_service_password: "{{ vault_otelcol_service_password }}" # This should come from Ansible Vault
