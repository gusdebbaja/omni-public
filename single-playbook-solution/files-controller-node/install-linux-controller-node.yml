---
- name: Install OpenTelemetry Collector (Linux Only)
  hosts: all
  gather_facts: true
  become: true

  vars:
    # OpenTelemetry version
    otelcol_contrib_version: "0.124.1"
    # Default paths - these will be determined by the package manager
    otelcol_config_dir: "/etc/otelcol-contrib"
    otelcol_config_path: "/etc/otelcol-contrib/config.yaml"
    otelcol_log_dir: "/var/log/otelcol-contrib"
    otelcol_data_dir: "/etc/otelcol-contrib/data"

    # Package URLs - using version variable for flexibility
    otelcol_rpm_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_contrib_version }}/otelcol-contrib_{{ otelcol_contrib_version }}_linux_amd64.rpm"
    otelcol_deb_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_contrib_version }}/otelcol-contrib_{{ otelcol_contrib_version }}_linux_amd64.deb"

    # Define the path to your external configuration templates directory
    templates_dir: "files-controller-node"

    # Force reinstall flag - can be overridden via command line
    force_reinstall: false

    otel_secrets:
      - name: splunk_token
        value: "{{ vault_splunk_token | default('00000000-0000-0000-0000-000000000000') }}"
        env_name: "SPLUNK_TOKEN"  # The environment variable name to use in config

  tasks:
    # Check if otelcol-contrib is already installed
    - name: Check if otelcol-contrib is already installed
      command: which otelcol-contrib
      register: which_otelcol
      failed_when: false
      changed_when: false

    # Fail if already installed and force_reinstall is false
    - name: Fail if otelcol-contrib is already installed and force_reinstall is false
      fail:
        msg: "OpenTelemetry Collector is already installed at {{ which_otelcol.stdout }}. If you want to reinstall, use --extra-vars 'force_reinstall=true'."
      when:
        - which_otelcol.rc == 0
        - not force_reinstall | bool

    # Remove existing installation if force_reinstall is true
    - name: Remove existing installation if force_reinstall is true
      block:
        - name: Stop otelcol-contrib service
          systemd:
            name: otelcol-contrib
            state: stopped
            enabled: no
          failed_when: false

        - name: Remove otelcol-contrib package on RedHat
          yum:
            name: otelcol-contrib
            state: absent
          when: ansible_os_family == 'RedHat'

        - name: Remove otelcol-contrib package on Debian
          apt:
            name: otelcol-contrib
            state: absent
          when: ansible_os_family == 'Debian'

        - name: Remove existing configuration files
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ otelcol_config_dir }}"
            - "/etc/systemd/system/otelcol-contrib.service.d"
            - "/run/credentials/otelcol-contrib"
            - "/run/otelcol-contrib"
            - "/etc/otelcol-contrib/data"  # Remove old data dir if it exists

        - name: Reload systemd
          systemd:
            daemon_reload: yes

        - name: Display reinstallation message
          debug:
            msg: "Existing OpenTelemetry Collector installation has been removed. Proceeding with fresh installation."
      when:
        - which_otelcol.rc == 0
        - force_reinstall | bool

    # Determine binary path based on distribution
    - name: Set path variables based on distribution
      set_fact:
        otelcol_binary_path: "/usr/bin/otelcol-contrib"
        package_tmp_path: "/tmp/otelcol-contrib_{{ otelcol_contrib_version }}_linux_amd64.{{ 'rpm' if ansible_os_family == 'RedHat' else 'deb' }}"
        package_url: "{{ otelcol_rpm_url if ansible_os_family == 'RedHat' else otelcol_deb_url }}"

    # Download appropriate package
    - name: Download otelcol-contrib package
      get_url:
        url: "{{ package_url }}"
        dest: "{{ package_tmp_path }}"
        mode: 0644
        timeout: 60
        validate_certs: yes
      register: download_result
      retries: 3
      delay: 5
      until: download_result is succeeded

    # Install package based on distribution
    - name: Install otelcol-contrib package on RedHat
      yum:
        name: "{{ package_tmp_path }}"
        state: present
        disable_gpg_check: yes  # Often needed for direct RPM installs
      when: ansible_os_family == 'RedHat'

    - name: Install otelcol-contrib package on Debian
      apt:
        deb: "{{ package_tmp_path }}"
        state: present
      when: ansible_os_family == 'Debian'

    # Ensure otelcol-contrib user has access to journald
    - name: Add otelcol-contrib user to systemd-journal group
      user:
        name: otelcol-contrib
        groups: systemd-journal
        append: yes
      register: user_modified

    # Create runtime credentials directory
    - name: Create runtime credentials directory
      file:
        path: "/run/credentials/otelcol-contrib"
        state: directory
        mode: 0700
        owner: otelcol-contrib
        group: otelcol-contrib

    # Create individual credential files dynamically based on the otel_secrets list
    - name: Create credential files for all defined secrets
      copy:
        dest: "/run/credentials/otelcol-contrib/{{ item.name }}"
        content: "{{ item.value }}"
        mode: 0400
        owner: otelcol-contrib
        group: otelcol-contrib
      no_log: false
      loop: "{{ otel_secrets }}"

    # Ensure target directory exists
    - name: Ensure target directory exists
      file:
        path: "{{ otelcol_config_dir }}"
        state: directory
        mode: 0755
        owner: otelcol-contrib
        group: otelcol-contrib

    # Find all template files (.j2 files) in the templates directory
    - name: Find template files in templates directory
      find:
        paths: "{{ templates_dir }}"
        patterns: "*.yaml.j2"
        recurse: no
      register: template_files
      delegate_to: localhost
      become: false

    # Debug what files were found
    - name: Debug found template files
      debug:
        msg: "Found template files: {{ template_files.files | map(attribute='path') | list }}"

    # Process and copy all template files
    - name: Copy template files to target configuration directory
      template:
        src: "{{ item.path }}"
        dest: "{{ otelcol_config_dir }}/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        mode: 0644
        owner: otelcol-contrib
        group: otelcol-contrib
      loop: "{{ template_files.files }}"
      register: templated_files

    # Check if any YAML files that aren't templates should be copied directly
    - name: Find static YAML files (not templates)
      find:
        paths: "{{ templates_dir }}"
        patterns: "*.yaml"
        excludes: "*.j2"
        recurse: no
      register: static_yaml_files
      delegate_to: localhost
      become: false

    # Debug what static files were found
    - name: Debug found static YAML files
      debug:
        msg: "Found static YAML files: {{ static_yaml_files.files | map(attribute='path') | list }}"

    # Copy any static YAML files directly (no templating)
    - name: Copy static YAML files to target configuration directory
      copy:
        src: "{{ item.path }}"
        dest: "{{ otelcol_config_dir }}/{{ item.path | basename }}"
        mode: 0644
        owner: otelcol-contrib
        group: otelcol-contrib
      loop: "{{ static_yaml_files.files }}"
      register: copied_files

    # Specific check for the SNMP file
    - name: Check if SNMP configuration file was processed
      stat:
        path: "{{ otelcol_config_dir }}/snmp-local-server.yaml"
      register: snmp_file

    # Debug message about SNMP file status
    - name: Debug SNMP file status
      debug:
        msg: "SNMP configuration file {{ 'exists' if snmp_file.stat.exists else 'DOES NOT EXIST' }} at {{ otelcol_config_dir }}/snmp-local-server.yaml"

    # Ensure main config.yaml exists (main entry point)
    - name: Check if main config.yaml was already deployed
      stat:
        path: "{{ otelcol_config_path }}"
      register: main_config

    # If the main config file wasn't included in the templates, create it explicitly
    - name: Ensure main config.yaml exists
      template:
        src: "{{ templates_dir }}/config.yaml.j2"
        dest: "{{ otelcol_config_path }}"
        mode: 0644
        owner: otelcol-contrib
        group: otelcol-contrib
      when: not main_config.stat.exists

    # Create the log directory
    - name: Create log directory
      file:
        path: "{{ otelcol_log_dir }}"
        state: directory
        owner: otelcol-contrib
        group: otelcol-contrib
        mode: '0755'

    # Create the data directory
    - name: Create data directory
      file:
        path: "{{ otelcol_data_dir }}"
        state: directory
        owner: otelcol-contrib
        group: otelcol-contrib
        mode: '0755'

    # Create the otelcol-contrib.conf file
    - name: Create otelcol-contrib.conf file
      file:
        path: "/etc/otelcol-contrib/otelcol-contrib.conf"
        state: touch
        owner: otelcol-contrib
        group: otelcol-contrib
        mode: '0644'

    # Configure systemd to use credentials
    - name: Create systemd environment directory
      file:
        path: "/etc/systemd/system/otelcol-contrib.service.d"
        state: directory
        mode: 0755
        owner: root
        group: root

    - name: Create systemd override with dynamic credentials
      copy:
        dest: "/etc/systemd/system/otelcol-contrib.service.d/override.conf"
        mode: 0644
        owner: root
        group: root
        content: |
          [Service]
          # Load credentials securely
          {% for secret in otel_secrets %}
          LoadCredential={{ secret.name }}:/run/credentials/otelcol-contrib/{{ secret.name }}
          {% endfor %}
          
          # Set environment variables for all secrets
          {% for secret in otel_secrets %}
          Environment={{ secret.env_name }}=${CREDENTIALS_DIRECTORY}/{{ secret.name }}
          {% endfor %}
          
          # Override the default ExecStart
          ExecStart=
          ExecStart=/usr/bin/otelcol-contrib --config={{ otelcol_config_path }}
          
          # Apply security hardening
          NoNewPrivileges=true
          ProtectHome=true
          PrivateTmp=true
          ProtectSystem=full
          ReadWritePaths={{ otelcol_log_dir }} {{ otelcol_data_dir }}

    # Validate configuration
    - name: Check configuration file syntax
      command: "{{ otelcol_binary_path }} validate --config={{ otelcol_config_path }}"
      register: config_validation
      failed_when: false
      environment:
        SPLUNK_TOKEN: "{{ vault_splunk_token | default('00000000-0000-0000-0000-000000000000') }}"

    # Debug validation output
    - name: Display validation issues
      debug:
        msg: "Configuration validation output: {{ config_validation.stderr }}"
      when: config_validation.rc != 0

    # Reload systemd
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    # Restart the service
    - name: Restart otelcol-contrib service
      systemd:
        name: otelcol-contrib
        state: restarted
      register: service_restart
      failed_when: false

    # Troubleshooting if service fails
    - name: Collect troubleshooting information
      block:
        - name: Get service status
          command: systemctl status otelcol-contrib
          register: service_status
          failed_when: false

        - name: Display service status
          debug:
            msg: "{{ service_status.stdout_lines + service_status.stderr_lines }}"

        - name: Get journalctl logs
          shell: journalctl -xeu otelcol-contrib.service --no-pager -n 50
          register: journalctl_output
          failed_when: false

        - name: Display journalctl logs
          debug:
            msg: "{{ journalctl_output.stdout_lines }}"

        - name: Check credentials directory
          command: ls -la /run/credentials/otelcol-contrib
          register: cred_perms
          failed_when: false

        - name: Display credentials directory permissions
          debug:
            msg: "{{ cred_perms.stdout_lines }}"

        - name: List configuration files
          shell: "ls -la {{ otelcol_config_dir }}"
          register: config_files
          failed_when: false

        - name: Display configuration files
          debug:
            msg: "{{ config_files.stdout_lines }}"

        - name: Fail with instructions
          fail:
            msg: "Service failed to start. Review the logs above for more information."
      when: service_restart.failed

    # Final status check
    - name: Verify otelcol-contrib service status
      command: systemctl status otelcol-contrib
      register: final_status
      changed_when: false

    # Display installation results
    - name: Display installation results
      debug:
        msg: "OpenTelemetry Collector has been {{ 'reinstalled' if force_reinstall | bool else 'installed' }} and is running with secure credential management."
