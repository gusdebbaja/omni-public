---
- name: Deploy Configuration to OpenTelemetry Collector
  hosts: all
  gather_facts: true
  become: true

  vars:
    # Default paths for OpenTelemetry Collector
    otelcol_config_dir: "/etc/otelcol-contrib"
    otelcol_config_path: "/etc/otelcol-contrib/config.yaml"
    otelcol_log_dir: "/var/log/otelcol-contrib"
    otelcol_data_dir: "/etc/otelcol-contrib/data"
    otelcol_binary_path: "/usr/bin/otelcol-contrib"

    # Define the path to your configuration templates directory
    templates_dir: "files-controller-node"
    
    # List of secrets to update
    otel_secrets:
      - name: splunk_token
        value: "{{ vault_splunk_token | default('00000000-0000-0000-0000-000000000000') }}"
        env_name: "SPLUNK_TOKEN"  # The environment variable name to use in config
    
    # Whether to update the systemd unit file
    update_systemd: true
    
    # Backup existing configuration
    backup_config: true

  tasks:
    # Check if otelcol-contrib is already installed
    - name: Check if otelcol-contrib is installed
      command: which otelcol-contrib
      register: which_otelcol
      failed_when: false
      changed_when: false

    # Fail if not installed
    - name: Fail if otelcol-contrib is not installed
      fail:
        msg: "OpenTelemetry Collector is not installed. Please run the installation playbook first."
      when: which_otelcol.rc != 0

    # Create backup directory if backup is enabled
    - name: Create backup directory
      file:
        path: "/etc/otelcol-contrib/backup-{{ ansible_date_time.date }}-{{ ansible_date_time.time | regex_replace(':', '-') }}"
        state: directory
        mode: 0755
        owner: otelcol-contrib
        group: otelcol-contrib
      when: backup_config
      register: backup_dir

    # Backup current configuration
    - name: Backup current configuration
      shell: "cp -r {{ otelcol_config_dir }}/*.yaml {{ backup_dir.path }}/"
      when: backup_config
      changed_when: true
      ignore_errors: yes

    # Find all template files (.j2 files) in the templates directory
    - name: Find template files in templates directory
      find:
        paths: "{{ templates_dir }}"
        patterns: "*.yaml.j2"
        recurse: no
      register: template_files
      delegate_to: localhost
      become: false

    # Debug what files were found
    - name: Debug found template files
      debug:
        msg: "Found template files: {{ template_files.files | map(attribute='path') | list }}"

    # Process and copy all template files
    - name: Copy template files to target configuration directory
      template:
        src: "{{ item.path }}"
        dest: "{{ otelcol_config_dir }}/{{ item.path | basename | regex_replace('\\.j2$', '') }}"
        mode: 0644
        owner: otelcol-contrib
        group: otelcol-contrib
      loop: "{{ template_files.files }}"
      register: templated_files

    # Check if any YAML files that aren't templates should be copied directly
    - name: Find static YAML files (not templates)
      find:
        paths: "{{ templates_dir }}"
        patterns: "*.yaml"
        excludes: "*.j2"
        recurse: no
      register: static_yaml_files
      delegate_to: localhost
      become: false

    # Debug what static files were found
    - name: Debug found static YAML files
      debug:
        msg: "Found static YAML files: {{ static_yaml_files.files | map(attribute='path') | list }}"

    # Copy any static YAML files directly (no templating)
    - name: Copy static YAML files to target configuration directory
      copy:
        src: "{{ item.path }}"
        dest: "{{ otelcol_config_dir }}/{{ item.path | basename }}"
        mode: 0644
        owner: otelcol-contrib
        group: otelcol-contrib
      loop: "{{ static_yaml_files.files }}"
      register: copied_files

    # Ensure main config.yaml exists (main entry point)
    - name: Check if main config.yaml was deployed as part of the templates
      stat:
        path: "{{ otelcol_config_path }}"
      register: main_config_after_copy

    # If the main config file wasn't included in the templates, create it explicitly
    - name: Ensure main config.yaml exists
      template:
        src: "{{ templates_dir }}/config.yaml.j2"
        dest: "{{ otelcol_config_path }}"
        mode: 0644
        owner: otelcol-contrib
        group: otelcol-contrib
      when: not main_config_after_copy.stat.exists
      register: main_config_created

    # Specific check for the SNMP file
    - name: Check if SNMP configuration file was processed
      stat:
        path: "{{ otelcol_config_dir }}/snmp-local-server.yaml"
      register: snmp_file

    # Debug message about SNMP file status
    - name: Debug SNMP file status
      debug:
        msg: "SNMP configuration file {{ 'exists' if snmp_file.stat.exists else 'DOES NOT EXIST' }} at {{ otelcol_config_dir }}/snmp-local-server.yaml"

    # Update credential files if needed
    - name: Update credential files for all defined secrets
      copy:
        dest: "/run/credentials/otelcol-contrib/{{ item.name }}"
        content: "{{ item.value }}"
        mode: 0400
        owner: otelcol-contrib
        group: otelcol-contrib
      loop: "{{ otel_secrets }}"
      no_log: false
      register: credentials_updated

    # Update systemd configuration if requested
    - name: Update systemd unit file
      block:
        - name: Create systemd environment directory
          file:
            path: "/etc/systemd/system/otelcol-contrib.service.d"
            state: directory
            mode: 0755
            owner: root
            group: root

        - name: Update systemd override with dynamic credentials
          copy:
            dest: "/etc/systemd/system/otelcol-contrib.service.d/override.conf"
            mode: 0644
            owner: root
            group: root
            content: |
              [Service]
              # Load credentials securely
              {% for secret in otel_secrets %}
              LoadCredential={{ secret.name }}:/run/credentials/otelcol-contrib/{{ secret.name }}
              {% endfor %}
              
              # Set environment variables for all secrets
              {% for secret in otel_secrets %}
              Environment={{ secret.env_name }}=${CREDENTIALS_DIRECTORY}/{{ secret.name }}
              {% endfor %}
              
              # Override the default ExecStart
              ExecStart=
              ExecStart=/usr/bin/otelcol-contrib --config={{ otelcol_config_path }}
              
              # Apply security hardening
              NoNewPrivileges=true
              ProtectHome=true
              PrivateTmp=true
              ProtectSystem=full
              ReadWritePaths={{ otelcol_log_dir }} {{ otelcol_data_dir }}
          register: systemd_updated

        - name: Reload systemd
          systemd:
            daemon_reload: yes
          when: systemd_updated.changed
      when: update_systemd

    # Validate configuration before restarting
    - name: Validate new configuration
      command: "{{ otelcol_binary_path }} validate --config={{ otelcol_config_path }}"
      register: config_validation
      failed_when: false
      environment:
        SPLUNK_TOKEN: "{{ vault_splunk_token | default('00000000-0000-0000-0000-000000000000') }}"

    # Debug validation output
    - name: Display validation results
      debug:
        msg: "{{ 'Configuration validation successful' if config_validation.rc == 0 else 'Configuration validation issues: ' + config_validation.stderr }}"

    # Restore from backup if validation fails
    - name: Restore from backup if validation fails
      block:
        - name: Restore configuration files
          shell: "cp -f {{ backup_dir.path }}/*.yaml {{ otelcol_config_dir }}/"
          when: backup_config
        
        - name: Display restoration message
          debug:
            msg: "Configuration validation failed. Restored from backup in {{ backup_dir.path }}"
        
        - name: Fail with error message
          fail:
            msg: "Aborting deployment due to configuration validation failure: {{ config_validation.stderr }}"
      when: 
        - config_validation.rc != 0
        - backup_config
        - "'requires a non-empty' not in config_validation.stderr"

    # Restart service if there were any changes or explicitly requested
    - name: Check if configuration changes were made
      set_fact:
        config_changes_made: "{{ (templated_files.changed | default(false)) or 
                                (copied_files.changed | default(false)) or 
                                (main_config_created.changed | default(false)) or 
                                (systemd_updated.changed | default(false)) or
                                (credentials_updated.changed | default(false)) }}"

    # Restart the service when changes were made
    - name: Restart otelcol-contrib service
      systemd:
        name: otelcol-contrib
        state: restarted
      when: config_changes_made
      register: service_restart
      failed_when: false

    # Troubleshooting if service fails
    - name: Collect troubleshooting information
      block:
        - name: Get service status
          command: systemctl status otelcol-contrib
          register: service_status
          failed_when: false

        - name: Display service status
          debug:
            msg: "{{ service_status.stdout_lines + service_status.stderr_lines }}"

        - name: Get journalctl logs
          shell: journalctl -xeu otelcol-contrib.service --no-pager -n 50
          register: journalctl_output
          failed_when: false

        - name: Display journalctl logs
          debug:
            msg: "{{ journalctl_output.stdout_lines }}"

        - name: Check credentials directory
          command: ls -la /run/credentials/otelcol-contrib
          register: cred_perms
          failed_when: false

        - name: Display credentials directory permissions
          debug:
            msg: "{{ cred_perms.stdout_lines }}"

        - name: List configuration files
          shell: "ls -la {{ otelcol_config_dir }}"
          register: config_files
          failed_when: false

        - name: Display configuration files
          debug:
            msg: "{{ config_files.stdout_lines }}"

        - name: Restore from backup if available
          shell: "cp -f {{ backup_dir.path }}/*.yaml {{ otelcol_config_dir }}/"
          when: backup_config and backup_dir.path is defined

        - name: Restart service after restoration
          systemd:
            name: otelcol-contrib
            state: restarted
          when: backup_config and backup_dir.path is defined
          register: restore_restart
          failed_when: false

        - name: Fail with instructions
          fail:
            msg: "Service failed to start with new configuration. {{ 'Configuration has been restored from backup.' if (backup_config and backup_dir.path is defined) else 'No backup was available for restoration.' }} Review the logs above for more information."
      when: 
        - service_restart is defined 
        - service_restart.failed is defined
        - service_restart.failed

    # Final status check
    - name: Verify otelcol-contrib service status
      command: systemctl status otelcol-contrib
      register: final_status
      changed_when: false
      failed_when: false

    # Display deployment results
    - name: Display deployment results
      debug:
        msg: >
          Configuration deployment {{ 'completed successfully' if final_status.rc == 0 else 'FAILED' }}.
          {% if backup_config %}A backup was created at {{ backup_dir.path }}.{% endif %}
          {% if config_changes_made %}Service was restarted with new configuration.{% else %}No configuration changes were detected, service was not restarted.{% endif %}
