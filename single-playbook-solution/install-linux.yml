---
- name: Install OpenTelemetry Collector (Linux Only)
  hosts: all
  gather_facts: true
  become: true

  vars:
    # OpenTelemetry version
    otelcol_contrib_version: "0.124.1"
    # Default paths - these will be determined by the package manager
    otelcol_config_dir: "/etc/otelcol-contrib"
    otelcol_config_path: "/etc/otelcol-contrib/config.yaml"
    otelcol_log_dir: "/var/log/otelcol-contrib"
    otelcol_data_dir: "/var/lib/otelcol-contrib"
    
    # Package URLs - using version variable for flexibility
    otelcol_rpm_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_contrib_version }}/otelcol-contrib_{{ otelcol_contrib_version }}_linux_amd64.rpm"
    otelcol_deb_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_contrib_version }}/otelcol-contrib_{{ otelcol_contrib_version }}_linux_amd64.deb"
    
    # Define the path to your external configuration template
    otelcol_config_template: "files/otelcol-contrib.yaml.j2"
    
    # Force reinstall flag - can be overridden via command line
    force_reinstall: false
    
    # Credentials - these should be in vault files
    # vault_splunk_token: "actual-token-here"

  tasks:
    # Check if otelcol-contrib is already installed
    - name: Check if otelcol-contrib is already installed
      command: which otelcol-contrib
      register: which_otelcol
      failed_when: false
      changed_when: false

    # Fail if already installed and force_reinstall is false
    - name: Fail if otelcol-contrib is already installed and force_reinstall is false
      fail:
        msg: "OpenTelemetry Collector is already installed at {{ which_otelcol.stdout }}. If you want to reinstall, use --extra-vars 'force_reinstall=true'."
      when: 
        - which_otelcol.rc == 0
        - not force_reinstall | bool

    # Remove existing installation if force_reinstall is true
    - name: Remove existing installation if force_reinstall is true
      block:
        - name: Stop otelcol-contrib service
          systemd:
            name: otelcol-contrib
            state: stopped
            enabled: no
          failed_when: false
          
        - name: Remove otelcol-contrib package on RedHat
          yum:
            name: otelcol-contrib
            state: absent
          when: ansible_os_family == 'RedHat'
          
        - name: Remove otelcol-contrib package on Debian
          apt:
            name: otelcol-contrib
            state: absent
          when: ansible_os_family == 'Debian'
          
        - name: Remove existing configuration files
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ otelcol_config_dir }}"
            - "/etc/systemd/system/otelcol-contrib.service.d"
            - "/run/credentials/otelcol-contrib"
            - "/run/otelcol-contrib"
            
        - name: Reload systemd
          systemd:
            daemon_reload: yes
            
        - name: Display reinstallation message
          debug:
            msg: "Existing OpenTelemetry Collector installation has been removed. Proceeding with fresh installation."
      when: 
        - which_otelcol.rc == 0
        - force_reinstall | bool

    # Determine binary path based on distribution
    - name: Set path variables based on distribution
      set_fact:
        otelcol_binary_path: "/usr/bin/otelcol-contrib"
        package_tmp_path: "/tmp/otelcol-contrib_{{ otelcol_contrib_version }}_linux_amd64.{{ 'rpm' if ansible_os_family == 'RedHat' else 'deb' }}"
        package_url: "{{ otelcol_rpm_url if ansible_os_family == 'RedHat' else otelcol_deb_url }}"

    # Download appropriate package
    - name: Download otelcol-contrib package
      get_url:
        url: "{{ package_url }}"
        dest: "{{ package_tmp_path }}"
        mode: 0644
        timeout: 60
        validate_certs: yes
      register: download_result
      retries: 3
      delay: 5
      until: download_result is succeeded

    # Install package based on distribution
    - name: Install otelcol-contrib package on RedHat
      yum:
        name: "{{ package_tmp_path }}"
        state: present
        disable_gpg_check: yes  # Often needed for direct RPM installs
      when: ansible_os_family == 'RedHat'

    - name: Install otelcol-contrib package on Debian
      apt:
        deb: "{{ package_tmp_path }}"
        state: present
      when: ansible_os_family == 'Debian'

    # Ensure otelcol-contrib user has access to journald
    - name: Add otelcol-contrib user to systemd-journal group
      user:
        name: otelcol-contrib
        groups: systemd-journal
        append: yes
      register: user_modified

    # Create runtime credentials directory
    - name: Create runtime credentials directory
      file:
        path: "/run/credentials/otelcol-contrib"
        state: directory
        mode: 0700
        owner: otelcol-contrib
        group: otelcol-contrib

    # Create individual credential files
    - name: Create splunk token credential file
      copy:
        dest: "/run/credentials/otelcol-contrib/splunk_token"
        content: "{{ vault_splunk_token | default('00000000-0000-0000-0000-000000000000') }}"
        mode: 0400
        owner: otelcol-contrib
        group: otelcol-contrib
      no_log: true

    # Deploy custom configuration file
    - name: Deploy otelcol-contrib configuration
      template:
        src: "{{ otelcol_config_template }}"
        dest: "{{ otelcol_config_path }}"
        mode: 0644
        owner: otelcol-contrib
        group: otelcol-contrib
      register: config_deployed

    # Configure systemd to use credentials
    - name: Create systemd environment directory
      file:
        path: "/etc/systemd/system/otelcol-contrib.service.d"
        state: directory
        mode: 0755
        owner: root
        group: root

    # Create systemd override for secure credentials
    - name: Create systemd override for secure credentials
      copy:
        dest: "/etc/systemd/system/otelcol-contrib.service.d/override.conf"
        mode: 0644
        owner: root
        group: root
        content: |
          [Service]
          # Load credentials securely
          LoadCredential=splunk_token:/run/credentials/otelcol-contrib/splunk_token
          
          # Dynamically create environment file at service start
          ExecStartPre=/bin/sh -c 'mkdir -p /run/otelcol-contrib'
          ExecStartPre=/bin/sh -c 'echo "# Environment variables for OpenTelemetry Collector" > /run/otelcol-contrib/env'
          ExecStartPre=/bin/sh -c 'echo "# Auto-generated at service start - do not edit" >> /run/otelcol-contrib/env'
          ExecStartPre=/bin/sh -c 'echo "pass_splunk_token=$$(cat $${CREDENTIALS_DIRECTORY}/splunk_token)" >> /run/otelcol-contrib/env'
          ExecStartPre=/bin/chown otelcol-contrib:otelcol-contrib /run/otelcol-contrib/env
          ExecStartPre=/bin/chmod 0400 /run/otelcol-contrib/env
          
          # Use the dynamically created environment file
          EnvironmentFile=/run/otelcol-contrib/env
          
          # Clean up the environment file when the service stops
          ExecStopPost=/bin/rm -f /run/otelcol-contrib/env
          
          # Additional security hardening
          NoNewPrivileges=true
          ProtectHome=true
          PrivateTmp=true
          ProtectSystem=full
          ReadWritePaths={{ otelcol_log_dir }} {{ otelcol_data_dir }} /run/otelcol-contrib

    # Validate configuration with temporary environment variables
    - name: Check configuration file syntax without full validation
      command: "{{ otelcol_binary_path }} validate --config={{ otelcol_config_path }}"
      register: config_validation
      failed_when: false
      environment:
        pass_splunk_token: "{{ vault_splunk_token | default('00000000-0000-0000-0000-000000000000') }}"
      
    - name: Display validation issues that aren't related to environment variables
      debug:
        msg: "Configuration validation output: {{ config_validation.stderr }}"
      when: config_validation.rc != 0
        
    - name: Fail on serious configuration syntax errors
      fail:
        msg: "Configuration validation failed with errors: {{ config_validation.stderr }}"
      when: 
        - config_validation.rc != 0
        - "'requires a non-empty' not in config_validation.stderr"

    # Prepare to handle service restart errors
    - name: Set daemon reload
      systemd:
        daemon_reload: yes
      
    # Restart service with error handling
    - name: Restart otelcol-contrib service
      systemd:
        name: otelcol-contrib
        state: restarted
      register: service_restart
      failed_when: false

    # Collect troubleshooting information if service fails to start
    - name: Collect troubleshooting information
      block:
        - name: Get service status
          command: systemctl status otelcol-contrib
          register: service_status
          failed_when: false
          
        - name: Display service status
          debug:
            msg: "{{ service_status.stdout_lines + service_status.stderr_lines }}"
            
        - name: Get journalctl logs
          shell: journalctl -xeu otelcol-contrib.service --no-pager -n 50
          register: journalctl_output
          failed_when: false
          
        - name: Display journalctl logs
          debug:
            msg: "{{ journalctl_output.stdout_lines }}"
            
        - name: Check environment file presence
          stat:
            path: "/run/otelcol-contrib/env"
          register: env_file
          
        - name: Display environment file status
          debug:
            msg: "Environment file status: {{ 'Exists' if env_file.stat.exists else 'Does not exist' }}"
            
        - name: Display environment file content if it exists
          shell: "cat /run/otelcol-contrib/env || echo 'File does not exist or cannot be read'"
          register: env_content
          failed_when: false
          when: env_file.stat.exists
          
        - name: Display environment content
          debug:
            msg: "{{ env_content.stdout_lines }}"
          when: env_file.stat.exists
          
        - name: Check service capabilities
          shell: "grep CapabilityBoundingSet /proc/$(systemctl show -p MainPID otelcol-contrib.service | cut -d= -f2)/status 2>/dev/null || echo 'Process not running'"
          register: cap_output
          failed_when: false
          
        - name: Display service capabilities
          debug:
            msg: "Service capabilities: {{ cap_output.stdout_lines }}"
            
        - name: Check permissions on credentials directory
          command: ls -la /run/credentials/otelcol-contrib
          register: cred_perms
          failed_when: false
          
        - name: Display credentials directory permissions
          debug:
            msg: "{{ cred_perms.stdout_lines }}"
            
        - name: Fail with instructions
          fail:
            msg: "Service failed to start. Review the logs above for more information. Ensure your configuration references the environment variables as ${pass_splunk_token} and ${pass_api_key} (not as vault_* variables)."
      when: service_restart.failed

    # Final status check
    - name: Verify otelcol-contrib service status
      command: systemctl status otelcol-contrib
      register: final_status
      changed_when: false

    # Display installation results
    - name: Display installation results
      debug:
        msg: "OpenTelemetry Collector has been {{ 'reinstalled' if force_reinstall | bool else 'installed' }} and is running with secure credential management."
